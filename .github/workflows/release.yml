# Release pipeline: only a pushed tag (v*) releases. Commits to master
# never do. Runs the local gates first, then publishes the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: changelog + version inference

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gates (build, vet, test)
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
